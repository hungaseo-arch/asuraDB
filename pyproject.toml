[project]
name = "asuradb"
version = "1.0.0"
description = "AsuraDB — Personal Knowledge DB collectors & scripts"
requires-python = ">=3.11"
dependencies = [
    "notion-client>=2.2.1",
    "supabase>=2.0.0",
    "sentence-transformers>=3.0.0",
    "schedule>=1.2.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "pdfminer.six>=20221105",
    "watchdog>=4.0.0",
    "python-dotenv>=1.0.0",
    "yfinance>=0.2.0",
    "anthropic>=0.25.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
